<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Anteprima social</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: #f8fafc;
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; position: relative; }
  .wrap { padding: 70px 80px; }
  .kicker { font-size: 26px; font-weight: 600; color: #93c5fd; letter-spacing: .04em; text-transform: uppercase; }
  h1 { font-size: 78px; line-height: 1.02; margin: 18px 0 26px; letter-spacing: -0.03em; max-width: 900px; }
  .sub { font-size: 32px; color: #cbd5e1; max-width: 860px; line-height: 1.3; }
  .chips { display: flex; gap: 14px; margin-top: 40px; }
  .chip { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
    padding: 12px 22px; font-size: 26px; font-weight: 600; }
  .tg { position: absolute; right: 80px; bottom: 64px; display: flex; align-items: center; gap: 14px;
    background: #229ed9; border-radius: 18px; padding: 18px 28px; font-size: 30px; font-weight: 700; }
  .tg svg { width: 38px; height: 38px; fill: #fff; }
  .box { position: absolute; right: 90px; top: 70px; font-size: 150px; }
</style>
</head>
<body>
  <div class="box">📦</div>
  <div class="wrap">
    <div class="kicker">Canale Telegram gratuito</div>
    <h1>Offerte vere sul sealed Pokémon in italiano</h1>
    <div class="sub">eBay + 11 negozi controllati ogni 5 minuti. Niente scalper, niente repack.</div>
    <div class="chips">
      <span class="chip">🔥 Offerte</span><span class="chip">🔔 Restock</span><span class="chip">🆕 Preordini</span>
    </div>
  </div>
  <div class="tg">
    <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
    t.me/sealedpokemonitalia
  </div>
</body>
</html>
